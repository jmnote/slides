name: Auto assign PR

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR
        uses: pozil/auto-assign-issue@v4
        with:
          assignees: jmnote
          repo-token: ${{ secrets.GITHUB_TOKEN }}
